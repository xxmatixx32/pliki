name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Wersja aplikacji (np. 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    branches:
      - main
      - master
      - work

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set app version
        id: vars
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "1.0.0" }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "app_version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish single-file EXE
        shell: pwsh
        run: |
          dotnet publish .\BlackThemeApp\BlackThemeApp.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:Version=${{ steps.vars.outputs.app_version }} `
            -o .\artifacts\publish

      - name: Build installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/BlackThemeApp.iss
          options: /DAppVersion=${{ steps.vars.outputs.app_version }} /DPublishDir=${{ github.workspace }}\artifacts\publish

      - name: Prepare downloadable files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\artifacts\download -Force | Out-Null
          Copy-Item .\artifacts\publish\BlackThemeApp.exe .\artifacts\download\BlackThemeApp.exe -Force
          Compress-Archive -Path .\artifacts\download\BlackThemeApp.exe -DestinationPath .\artifacts\download\BlackThemeApp-win-x64-exe.zip -Force

      - name: Upload EXE ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackThemeApp-win-x64-exe
          path: .\artifacts\download\BlackThemeApp-win-x64-exe.zip
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackThemeApp-setup-exe
          path: .\artifacts\installer\BlackThemeApp-Setup-${{ steps.vars.outputs.app_version }}.exe
          if-no-files-found: error

      - name: Create GitHub release with EXE files
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.vars.outputs.app_version }}
          name: BlackThemeApp v${{ steps.vars.outputs.app_version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            .\artifacts\download\BlackThemeApp-win-x64-exe.zip
            .\artifacts\installer\BlackThemeApp-Setup-${{ steps.vars.outputs.app_version }}.exe
